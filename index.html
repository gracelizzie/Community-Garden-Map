<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Community Garden Map</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Community Garden</h1>

<button id="toggleTrees">

    Hide trees

</button>

<div id="map"></div>


<div id="overlay" class="hidden">

    <div id="popup">

        <div id="popupEmoji"></div>

        <h2 id="popupTitle"></h2>

        <div id="popupType"></div>

        <div id="currentContents"></div>

        <div id="popupContent"></div>

        <div id="popupActions">
            <button id="addUpdateButton">＋ Add update</button>
            <button id="editBedButton">✏️ Edit bed</button>
        </div>

        <div id="updateForm" class="hidden">

            <h3>Add update</h3>

            <label for="updateText">What happened?</label>

            <textarea
                id="updateText"
                rows="4"
                placeholder="Write an update..."
            ></textarea>

            <label for="updatePhoto">Add a photo</label>

            <input
                type="file"
                id="updatePhoto"
                accept="image/*"
            >

            <div id="updateFormActions">
                <button id="saveUpdateButton">Save update</button>
                <button id="cancelUpdateButton">Cancel</button>
            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/features.js"></script>
<script src="js/popup.js"></script>
<script src="js/layers.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>


</body>
